function buy(item,m,currency){if(item.kind==='module'){let fresh=catalogue(m).find(x=>x.id===item.id);if(moduleLevel(item.key)>=3||profile[currency]<fresh[currency])return;profile[currency]-=fresh[currency];profile.upgrades[item.key]=moduleLevel(item.key)+1;saveProfile();shop(m);toast('تجهیز دائمی ارتقا یافت');return}if(profile[currency]<item[currency])return;profile[currency]-=item[currency];let stock=profile.stock[m],message='خرید انجام شد';if(item.kind==='skin'){profile.owned.push(item.id);profile.equipped[m]=item.n}else if(item.kind==='life')stock.lives=(stock.lives||0)+item.n;else if(item.kind==='power')stock[item.key]=(stock[item.key]||0)+1;else{let powers=catalogue(m).filter(i=>i.kind==='power'),won=[];for(let i=0;i<item.n;i++){let p=powers[Math.floor(Math.random()*powers.length)];stock[p.key]=(stock[p.key]||0)+1;won.push(p.label)}message=won.join(' + ')}saveProfile();shop(m);tone(600,.12);toast(message)}
let coinBonus=1,gemBonus=1,autoPowder=0;
function applyLoadout(){coinBonus=gemBonus=1;autoPowder=0;let stock=profile.stock[mode],extra=Math.min(2,stock.lives||0);lives+=extra;stock.lives=(stock.lives||0)-extra;for(let key of Object.keys(stock)){if(key==='lives'||stock[key]<=0)continue;stock[key]--;if(key==='coinBoost')coinBonus=2;else if(key==='gemBoost')gemBonus=2;else if(key==='slow')freeze=12;else if(key==='powder')autoPowder=12;else if(key==='heart')lives=Math.min(5,lives+1);else collectDrop({type:key,x:W/2,y:H/2})}saveProfile()}

function beginBoss(){boss={x:W/2,y:Math.min(H*.28,220),r:Math.min(W*.12,48),hp:mode==='space'?65+stage*2:38+Math.floor(stage*.65),max:mode==='space'?65+stage*2:38+Math.floor(stage*.65),time:0,cool:1.8,hit:0};objs=[];enemies=[];enemyShots=[];toast(chapter().boss);tone(170,.4)}

function updateBoss(dt){bossClock+=dt;if(stage%5===0&&!bossDone&&!boss&&stageTime>10)beginBoss();if(!boss)return;let b=boss;b.time+=dt;b.hit=Math.max(0,b.hit-dt);b.x=W/2+Math.sin(b.time*.8)*W*.28;b.cool-=dt*(freeze?.3:1);spawn=enemySpawn=2;for(let i=shots.length-1;i>=0;i--){let shot=shots[i];if(Math.hypot(shot.x-b.x,shot.y-b.y)<b.r+shot.r){shots.splice(i,1);hurtBoss(shot.bomb?6:1);if(!boss)return}}if(mode==='space'&&laser>0&&Math.abs(shipX-b.x)<b.r){hurtBoss(dt*18);if(!boss)return}if(mode==='classic'&&pointer&&Math.hypot(aim.x-b.x,aim.y-b.y)<b.r+35&&Math.sin(b.time*1.5)>-.7){hurtBoss(dt*12);if(!boss)return;burst(aim.x,aim.y,chapter().accent,1)}if(b.cool<=0){b.cool=mode==='space'?Math.max(.7,1.8-stage*.005):2.6;if(mode==='space'){let count=b.hp<b.max*.5?7:5;for(let i=0;i<count;i++){let angle=Math.PI/2+(i-(count-1)/2)*.2;enemyShots.push({x:b.x,y:b.y+b.r,vx:Math.cos(angle)*145,vy:Math.sin(angle)*145,r:5,col:'#ffab8d'})}}else for(let i=0;i<3;i++)objs.push({x:W*(.2+i*.3),y:b.y+b.r,r:14,type:i===1?'red':'white',vy:110+stage,rot:0})}$('bossBar').classList.remove('hidden');$('bossBar').innerHTML=chapter().boss+' / '+Math.ceil(b.hp)+'<div class="bossTrack"><div class="bossFill" style="width:'+Math.max(0,b.hp/b.max*100)+'%"></div></div>'}
function drawBoss(){if(!boss)return;let b=boss,c=chapter();cx.save();cx.translate(b.x,b.y);cx.rotate(Math.sin(b.time)*.12);cx.strokeStyle=b.hit?'#fff':c.accent;cx.fillStyle=c.color;cx.lineWidth=3;cx.shadowColor=c.accent;cx.shadowBlur=b.hit?25:10;if(mode==='space'){cx.beginPath();cx.moveTo(0,b.r);cx.lineTo(-b.r*.5,b.r*.35);cx.lineTo(-b.r*1.4,b.r*.6);cx.lineTo(-b.r,-b.r*.6);cx.lineTo(-b.r*.3,-b.r*.35);cx.lineTo(0,-b.r);cx.lineTo(b.r*.3,-b.r*.35);cx.lineTo(b.r,-b.r*.6);cx.lineTo(b.r*1.4,b.r*.6);cx.lineTo(b.r*.5,b.r*.35);cx.closePath();cx.fill();cx.stroke()}else{cx.rotate(b.time*.3);for(let i=0;i<6;i++){cx.rotate(Math.PI/3);cx.strokeRect(-b.r*.28,-b.r,b.r*.56,b.r*.45)}cx.beginPath();cx.arc(0,0,b.r*.7,0,Math.PI*2);cx.fill();cx.stroke()}cx.fillStyle=(mode==='classic'&&Math.sin(b.time*1.5)<=-.7)?'#ed705d':'#e4ffff';cx.beginPath();cx.arc(0,0,b.r*.24,0,Math.PI*2);cx.fill();cx.restore()}
function campaign(dt){stageTime+=dt;updateBoss(dt);roll=Math.max(0,roll-dt);rollCD=Math.max(0,rollCD-dt);autoPowder=Math.max(0,autoPowder-dt);if(autoPowder&&mode==='classic')for(let o of [...objs])if(o.type==='white'&&o.y>H*.6)tap(o);let cap=mode==='space'?150:200,target=mode==='space'?12+Math.min(38,Math.floor(stage/3)):16+Math.min(54,Math.floor(stage/3)),duration=35+Math.min(30,stage*.2);let progress=Math.min(stageTime/duration,stageKills/target);$('stageBadge').innerHTML=(mode==='space'?'SPACE ':'BALL ')+stage+' / '+cap+' · '+stageKills+'/'+target+(mode==='space'?' · ROLL '+(rollCD>0?Math.ceil(rollCD)+'s':'READY'):'')+'<div class=progressTrack><div class=progressFill style="width:'+Math.min(100,progress*100)+'%"></div></div>';if(stageTime>=duration&&stageKills>=target&&(stage%5!==0||bossDone)){let first=stage>profile.cleared[mode];if(first){profile.coins+=40+stage*2;profile.gems+=stage%5===0?5:1;profile.cleared[mode]=stage}if(stage>=cap){bankRun();finish();$('panel').insertAdjacentHTML('afterbegin','<h2>روشنایی بازگشت</h2>');return}stage++;boss=null;bossDone=false;bossClock=0;$('bossBar').classList.add('hidden');profile.levels[mode]=Math.max(profile.levels[mode],stage);saveProfile();stageTime=stageKills=0;objs=[];enemies=[];enemyShots=[];drops=[];spawn=1.2;invuln=2;toast('STAGE '+stage+' · '+(first?'REWARD SAVED':'READY'));tone(720,.22);let nextMode=mode;story(nextMode,stage,()=>{state='play';pointer=false;last=performance.now();setTheme()})}}
function resizePlayer(){shipX=targetX=W/2}function hud(){$('score').textContent=score;$('lives').textContent=lives;$('coins').textContent=coins;$('gems').textContent=gems}function toast(s){let e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove('show'),1300)}function tone(f=440,d=.08){if(!soundOn)return;try{audio=audio||new AudioContext;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d+.02)}catch(e){}}

function musicPattern(){let stageBand=stage%5===0?'boss':mode==='classic'?'classic':stage<6?'early':stage<15?'mid':'late';let patterns={early:[220,277,330,277],mid:[196,247,294,370,294,247],late:[165,196,247,294,330,294],boss:[110,147,165,220,165,147],classic:[262,330,392,330]};return patterns[stageBand]||patterns.early}

(function(){
 const dropPalette={coin:'#ffd35c',gem:'#ff67d9',shield:'#74edff',rapid:'#ff7ad9',spread:'#b9a7ff',laser:'#65efff',bomb:'#ffbe55',helpers:'#a6bfff',freeze:'#8cf7ff',magnet:'#ffda6a',repair:'#74ffad',nova:'#ff9b6e',overdrive:'#ff7ad9',prism:'#b9a7ff'};

 function drawDropGlyph(kind,c){let col=dropPalette[kind]||c;cx.save();cx.lineWidth=3;cx.strokeStyle=col;cx.fillStyle=col+'55';cx.shadowColor=col;cx.shadowBlur=14;let r=20;
  if(kind==='coin'){cx.beginPath();cx.arc(0,0,r,0,6.28);cx.fill();cx.stroke();cx.fillStyle='#fff5b0';cx.font='bold 22px system-ui';cx.textAlign='center';cx.fillText('¢',0,8)}

 drawPickup=function(d,now){let color=dropPalette[d.type]||chapter().accent,r=32+Math.sin(now*.003+d.x)*2;cx.save();cx.translate(d.x,d.y);cx.fillStyle='#101b2ef2';cx.strokeStyle=color;cx.lineWidth=2;cx.shadowColor=color;cx.shadowBlur=12;cx.beginPath();cx.arc(0,0,r,0,6.28);cx.fill();cx.stroke();cx.shadowBlur=0;cx.save();cx.rotate(now*.001);cx.setLineDash([5,7]);cx.beginPath();cx.arc(0,0,r+6,0,6.28);cx.stroke();cx.restore();drawDropGlyph(d.type,color);cx.fillStyle='#eaffff';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText(dropLabels[d.type]||pickupNames[d.type]||d.type,0,48);cx.restore()};
 drawShip=function(){let y=H-105,sc=skinColor('space');cx.save();cx.translate(shipX,y);if(roll>0){cx.rotate((1-roll/.65)*Math.PI*4);cx.scale(1,.6+.4*Math.abs(Math.cos(roll*12)))}cx.shadowColor=sc;cx.shadowBlur=24;cx.fillStyle=sc;cx.strokeStyle='#e9ffff';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,-34);cx.lineTo(29,22);cx.lineTo(9,16);cx.lineTo(0,28);cx.lineTo(-9,16);cx.lineTo(-29,22);cx.closePath();cx.fill();cx.stroke();cx.fillStyle='#17263d';cx.beginPath();cx.ellipse(0,-10,9,13,0,0,6.28);cx.fill();cx.stroke();cx.fillStyle=chapter().accent;cx.beginPath();cx.arc(0,-10,4,0,6.28);cx.fill();cx.fillStyle='#69eaff';cx.fillRect(-22,19,10,4);cx.fillRect(12,19,10,4);if(helpers){cx.strokeStyle='#a6bfff';cx.beginPath();cx.moveTo(-25,8);cx.lineTo(-42,18);cx.moveTo(25,8);cx.lineTo(42,18);cx.stroke()}if(laser){cx.strokeStyle='#65efff';cx.lineWidth=3;cx.beginPath();cx.moveTo(0,-30);cx.lineTo(0,-43);cx.stroke()}if(rapid||overdrive){cx.fillStyle='#ff7ad9';cx.fillRect(-5,27,10,7)}if(shield){cx.strokeStyle='#73eaff';cx.lineWidth=2;cx.beginPath();cx.arc(0,0,39,0,6.28);cx.stroke()}cx.restore()};
 const baseStartMusic=startMusic,baseStopMusic=stopMusic;let musicEpoch=0;
